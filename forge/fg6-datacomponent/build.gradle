plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

def mc = project.findProperty('mc') ?: '1.20.1'

// MC 版本 -> [Forge userdev 坐标, Forge 主版本号]。只传 -Pmc，避免长版本号被命令行拆分。
def FORGE = [
    '1.20.1' : ['1.20.1-47.4.28',  '47'],
    '1.20.2' : ['1.20.2-48.0.0',   '48'],
    '1.20.3' : ['1.20.3-49.0.1',   '49'],
    '1.20.4' : ['1.20.4-49.2.13',  '49'],
    '1.20.6' : ['1.20.6-50.2.15',  '50'],
    '1.21'   : ['1.21-51.0.0',     '51'],
    '1.21.1' : ['1.21.1-52.1.21',  '52'],
    '1.21.3' : ['1.21.3-53.1.16',  '53'],
    '1.21.4' : ['1.21.4-54.1.22',  '54'],
    '1.21.5' : ['1.21.5-55.1.18',  '55'],
    '1.21.6' : ['1.21.6-56.0.0',   '56'],
    '1.21.7' : ['1.21.7-57.0.0',   '57'],
    '1.21.8' : ['1.21.8-58.1.26',  '58'],
    '1.21.9' : ['1.21.9-59.0.5',   '59'],
    '1.21.10': ['1.21.10-60.1.18', '60'],
    '1.21.11': ['1.21.11-61.2.5',  '61'],
    '26.1'   : ['26.1-62.0.9',     '62'],
    '26.1.1' : ['26.1.1-63.0.2',   '63'],
    '26.1.2' : ['26.1.2-64.1.6',   '64'],
    '26.2'   : ['26.2-65.1.6',     '65'],
    '26.3'   : ['26.3-66.1.5',     '66'],
]
def cfg = FORGE[mc]
if (cfg == null) {
    throw new GradleException('未登记的 MC 版本: ' + mc)
}
def forgeVer = cfg[0]
def forgeMajor = cfg[1]

version = "1.0.0-${mc}-forge"
group = 'top.nekoaidev.customdiscs'
base { archivesName = 'customdiscs' }

// Forge 的 fmlcore/fmlloader 等库按 JVM 版本发布：1.20.1~1.20.4 要 17，
// 1.20.6 起要 21，26.x 要 25。这里不跟着切的话，依赖解析会以 JVM 17
// 去找 1.20.6 的库，直接报「only compatible with JVM runtime version 21」。
def javaVer = 17
if (mc.startsWith('26.')) {
    javaVer = 25
} else if (!(mc in ['1.20.1', '1.20.2', '1.20.3', '1.20.4'])) {
    javaVer = 21
}
java {
    sourceCompatibility = JavaVersion.valueOf("VERSION_${javaVer}")
    targetCompatibility = JavaVersion.valueOf("VERSION_${javaVer}")
}

minecraft {
    mappings channel: 'official', version: mc
    copyIdeResources = true
}

dependencies {
    minecraft "net.minecraftforge:forge:${forgeVer}"
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 关键：把 mc / version 声明为输入，否则增量构建会跳过资源处理，
// 出现「jar 文件名对了但 mods.toml 还是上一个版本」的坑。
tasks.named('processResources') {
    // Windows 默认 GBK，不显式指定的话 expand 会把 mods.toml 里的中文写坏，
    // Forge 用 UTF-8 读 mods.toml 会出现署名/描述乱码。
    filteringCharset = 'UTF-8'
    inputs.property 'mc', mc
    inputs.property 'version', project.version
    inputs.property 'forgeMajor', forgeMajor
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version, 'mc': mc, 'forgeMajor': forgeMajor
    }
    outputs.upToDateWhen { false }
}
