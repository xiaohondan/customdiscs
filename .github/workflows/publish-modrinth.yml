name: 同步到 Modrinth 与 CurseForge

# 只有在「产物 / 清单 / 同步脚本 / 本工作流」变化时才发版。
# 改 README、改源码不会触发上传，避免无意义的 API 调用。
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'release-manifest.json'
      - 'tools/sync_modrinth.py'
      - 'tools/sync_curseforge.py'
      - '.github/workflows/publish-modrinth.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只允许一个同步任务，避免并发建出重复版本
concurrency:
  group: modrinth-sync
  cancel-in-progress: false

jobs:
  sync:
    name: 校验并同步 21 个版本
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 本地校验（离线，不联网）
        run: python tools/sync_modrinth.py --check-only

      - name: 同步到 Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python tools/sync_modrinth.py --go --replace-mismatch

      # ---- CurseForge 同步：当前停用 ----
      # 诊断结果（CI 实测）：项目 ID 1784647 在 CF 两个官方 host 均返回 404，
      # 说明该项目在 CurseForge 上不存在（ID 错或未建项目），并非 Token 问题。
      # 待主人在 CF 网页确认/创建项目并提供正确数字 ID 后：
      #   1) 删除下面这行 `if: false`
      #   2) 把 run 改成 `python tools/sync_curseforge.py --go`（脚本已内置两 host 探测 + 项目身份校验 + 幂等）
      #   3) 必要时更新脚本里的 PROJECT_ID
      - name: CurseForge 同步（已停用：待正确项目 ID）
        if: false
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: python tools/sync_curseforge.py --go
