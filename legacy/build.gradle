plugins {
    id 'fabric-loom' // 版本由 settings.gradle 按目标 MC 版本统一指定
    id 'maven-publish'
}

// ===== 多版本：用 -Pmc=版本 切换目标 Minecraft 版本（默认见 gradle.properties） =====
// 例：./gradlew build -Pmc=1.20.1   /   ./gradlew build -Pmc=1.21.11
def mc = project.findProperty('mc') ?: minecraft_version

// 各版本对应的依赖精确版本。未收录的版本会用最新依赖兜底（见下方 fallback 与 README 说明）。
def pins = [
    '1.20.1': [y:'1.20.1+build.10', l:'0.14.21', f:'0.91.0+1.20.1', c:'13.0.121', m:'9.0.0'],
    '1.20.2': [y:'1.20.2+build.4',  l:'0.14.22', f:'0.91.6+1.20.2', c:'13.0.121', m:'9.0.0'],
    '1.20.3': [y:'1.20.3+build.1',  l:'0.14.24', f:'0.91.1+1.20.3', c:'14.0.123', m:'9.0.0'],
    '1.20.4': [y:'1.20.4+build.1',  l:'0.15.0',  f:'0.96.0+1.20.4', c:'14.0.126', m:'10.0.0'],
    '1.20.5': [y:'1.20.5+build.1',  l:'0.15.11', f:'0.97.0+1.20.5', c:'14.0.129', m:'10.0.0'],
    '1.20.6': [y:'1.20.6+build.1',  l:'0.15.11', f:'0.97.8+1.20.6', c:'14.0.129', m:'11.0.0'],
    // ---- 1.21+ 真实依赖：2026-11-06 实测各 maven 仓库 metadata，逐个 pom 均返回 200 ----
    // 版本编号说明：Mojang 自 2026 年起改用「年份.第几次更新」，26.1 / 26.2 / 26.3 均为正式版
    //      （官方清单 latest.release = 26.3）。真正不存在的只是旧编号的 1.22 及以上；
    //      原 pins 表里写过的 1.22–1.26.3 是把 26.x 误读成 1.26.x 的占位数据，已删除。
    // 26.x 不在本 pins 表中：MC 自 26.1 起不再混淆、Yarn 停更（yarn 仓库最高仅 1.21.11+build.6），
    //      需要免重映射插件 + JDK 25 + Gradle 9.x + 全量 Mojang 官方类名源码变体，
    //      已单独在平级目录 CustomDiscs26/ 完成并出包，详见 ../CustomDiscs26/26.x发布说明.md。
    // 1.21+ 的唱片系统改为 JukeboxSong 数据驱动，使用 src/v-modern 源码变体构建。
    '1.21'    : [y:'1.21+build.9', l:'0.16.14', f:'0.102.0+1.21', c:'15.0.140', m:'11.0.5'],
    '1.21.1'  : [y:'1.21.1+build.3', l:'0.16.14', f:'0.105.0+1.21.1', c:'15.0.140', m:'11.0.5'],
    '1.21.2'  : [y:'1.21.2+build.1', l:'0.16.14', f:'0.106.1+1.21.2', c:'17.0.142', m:'12.0.1'],
    '1.21.3'  : [y:'1.21.3+build.2', l:'0.16.14', f:'0.114.1+1.21.3', c:'17.0.142', m:'12.0.1'],
    '1.21.4'  : [y:'1.21.4+build.8', l:'0.16.14', f:'0.119.4+1.21.4', c:'17.0.142', m:'13.0.4'],
    '1.21.5'  : [y:'1.21.5+build.1', l:'0.16.14', f:'0.128.2+1.21.5', c:'18.0.145', m:'14.0.2'],
    '1.21.6'  : [y:'1.21.6+build.1', l:'0.16.14', f:'0.128.2+1.21.6', c:'19.0.147', m:'15.0.2'],
    '1.21.7'  : [y:'1.21.7+build.8', l:'0.16.14', f:'0.129.0+1.21.7', c:'19.0.147', m:'15.0.2'],
    '1.21.8'  : [y:'1.21.8+build.1', l:'0.16.14', f:'0.136.1+1.21.8', c:'19.0.147', m:'15.0.2'],
    '1.21.9'  : [y:'1.21.9+build.1', l:'0.17.3', f:'0.134.1+1.21.9', c:'20.0.149', m:'16.0.1'],
    '1.21.10' : [y:'1.21.10+build.3', l:'0.17.3', f:'0.138.4+1.21.10', c:'20.0.149', m:'16.0.1'],
    '1.21.11' : [y:'1.21.11+build.6', l:'0.17.3', f:'0.141.6+1.21.11', c:'21.11.151', m:'17.0.1'],
]

def pin = pins[mc]
def yarn      = pin?.y ?: "${mc}+build.1"
def loader    = pin?.l ?: '*'
def fabricApi = pin?.f ?: '*'
def cloth     = pin?.c ?: '*'
def modmenu   = pin?.m ?: '*'

if (!pin) {
    println "[CustomDiscs] 警告：build.gradle 的 pins 表未收录 ${mc}，已用最新依赖兜底。" +
            "请到 https://fabricmc.net/ 查该版本对应的 fabric-api / yarn / loader 后填入 pins 表。"
}

// 1.20.x 需要 Java 17，1.21+ 需要 Java 21
def javaRelease = (mc.startsWith('1.20.') || mc.startsWith('1.19.')) ? 17 : 21
// 1.20.1–1.20.4 使用三参变体（src/v-old），1.20.5–1.20.6 用四参变体（src/v-new）。
// 注意：1.20.x 的 yarn 里这个类实际都叫 MusicDiscItem，两个变体仅保留以便日后区分。
def isOldRecord = mc.matches('1\\.20\\.[0-4]')
// 1.21+ 删掉了 MusicDiscItem，改用 JukeboxSong 数据驱动 + JukeboxPlayable 组件（src/v-modern）
def num = mc.tokenize('.').collect { it.isInteger() ? it as int : 0 }
def isModern = (num[0] > 1) || (num[0] == 1 && num.size() > 1 && num[1] >= 21)

base {
    archivesName = project.archive_base_name
    // 不同目标版本产出不同文件名，避免互相覆盖
    version = project.mod_version + "-${mc}"
    group = project.maven_group
}

repositories {
    maven { url 'https://maven.aliyun.com/repository/public' } // 阿里云公共仓库（Maven Central 镜像）
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.shedaniel.me/' }       // Cloth Config
    maven { url 'https://maven.terraformersmc.com/' } // Mod Menu
}

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    mappings "net.fabricmc:yarn:${yarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"

    if (cloth != '*') {
        modApi "me.shedaniel.cloth:cloth-config-fabric:${cloth}"
    } else {
        modApi "me.shedaniel.cloth:cloth-config-fabric:+"
    }
    if (modmenu != '*') {
        modImplementation "com.terraformersmc:modmenu:${modmenu}"
    } else {
        modImplementation "com.terraformersmc:modmenu:+"
    }
}

// 按版本切换 RecordItem 变体：旧版三参 / 新版四参
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
            srcDirs += isModern ? 'src/v-modern/java' : (isOldRecord ? 'src/v-old/java' : 'src/v-new/java')
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mc', mc
    filesMatching('fabric.mod.json') {
        // 每个 jar 只声明自己真正编译所针对的 MC 版本，避免平台误判为全版本兼容
        expand 'version': project.version, 'mc_version': "=${mc}"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = javaRelease
}

java {
    def v = javaRelease == 17 ? JavaVersion.VERSION_17 : JavaVersion.VERSION_21
    sourceCompatibility = v
    targetCompatibility = v
}

